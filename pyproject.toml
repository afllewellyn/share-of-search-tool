[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "share-of-search"
version = "1.0.0"
description = "Measure Share of Search — a brand's organic branded search volume as a percentage of its category's total."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Andrew Llewellyn" }]
keywords = ["share-of-search", "marketing", "brand", "seo", "dataforseo", "effectiveness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1",
    "pandas>=1.5",
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/afllewellyn/share-of-search-tool"
Issues = "https://github.com/afllewellyn/share-of-search-tool/issues"

[project.scripts]
sos = "sos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sos = ["dashboard/template.html", "dashboard/vendor/*.js", "dashboard/vendor/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
